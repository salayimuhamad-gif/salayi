; Mulkihawler — Hostinger PHP settings.
;
; MULKIHAWLER_APP_BASE must be the ABSOLUTE path to the /application directory.
; Replace ACCOUNT with your Hostinger username. index.php prints the path it
; tried and stops if this is wrong, rather than failing opaquely later.
;
; env[MULKIHAWLER_APP_BASE] = /home/ACCOUNT/application

; The installer's migration step is the one place that legitimately needs more
; than a shared host's default execution window.
max_execution_time = 120
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 20M
