name: Security Composer update

# The Composer twin of "Refresh dependencies and built assets", for the same
# reason that workflow exists: security updates to a dependency lock can only
# be produced where the registry is reachable, and Packagist is unreachable
# from the offline release-engineering sandbox. Hand-editing composer.lock
# would be fabricating resolution evidence (source/dist references, package
# metadata), so the update has to happen on a runner, with Composer itself
# writing every byte of the lock.
#
# This manually-dispatched job applies ONE requested package update, proves
# the result, regenerates the tree identity files, and pushes back to the
# branch it ran on. It never fires on its own.
#
# It FAILS rather than pushing a half-fix: `composer audit` is the gate — if
# ANY advisory still fails the audit after the update, the run stops and the
# lock is left alone. The audit is never configured, filtered or suppressed
# here; a finding that needs a larger bump is a deliberate decision, not an
# automatic one.
#
# A push made with the workflow's own token does not trigger CI (GitHub's
# recursion guard), so dispatch the CI workflow against the branch afterwards
# to prove the refreshed tree.

on:
  workflow_dispatch:
    inputs:
      composer_update_spec:
        description: >-
          Composer update spec WITH an exact version, e.g.
          league/commonmark:2.9.1. Exactly this package is updated
          (transitive packages included); nothing else moves.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: security-composer-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Update the Composer lock on a runner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, fileinfo, intl, json, mbstring, openssl, pdo, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-8.3-${{ hashFiles('composer.lock') }}

      # From the committed lock first, so the starting point is exactly what
      # CI installs today.
      - name: Install from the committed lock
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply the requested update, and only it
        env:
          SPEC: ${{ inputs.composer_update_spec }}
        run: |
          composer update --no-interaction --no-progress "$SPEC"
          NAME="${SPEC%%:*}"
          echo "== resolved lock entry =="
          php -r '$l = json_decode(file_get_contents("composer.lock"), true);
              foreach ($l["packages"] as $p) {
                  if ($p["name"] === $argv[1]) {
                      echo $p["name"], " ", $p["version"], "\n";
                      echo "source reference: ", $p["source"]["reference"] ?? "-", "\n";
                  }
              }' "$NAME"

      - name: Validate the updated manifest and lock
        run: composer validate --strict

      # The gate, not a formality: the push happens only when the audit is
      # clean. No ignore lists, no severity filtering, no configuration.
      - name: Verify the audit is clean
        run: composer audit --no-interaction

      # The lock has changed, so prove it still installs cleanly from scratch
      # before anything ships it.
      - name: Reinstall from the updated lock
        run: |
          rm -rf vendor
          composer install --no-interaction --no-progress --prefer-dist

      - name: Regenerate the tree identity
        run: |
          php scripts/release/stage_tree.php --project-root="$PWD" --stage-dir=/tmp/stage-a > /dev/null
          php scripts/release/stage_tree.php --project-root="$PWD" --stage-dir=/tmp/stage-b > /dev/null
          a=$(cut -d' ' -f1 /tmp/stage-a/TREE_MANIFEST.sha256)
          b=$(cut -d' ' -f1 /tmp/stage-b/TREE_MANIFEST.sha256)
          [ "$a" = "$b" ] || { echo "staging is not a fixed point: $a vs $b"; exit 1; }
          cp /tmp/stage-a/TREE_MANIFEST.txt /tmp/stage-a/TREE_MANIFEST.sha256 /tmp/stage-a/SHA256SUMS.txt .
          echo "tree identity: $a"

      - name: Commit and push if anything changed
        env:
          SPEC: ${{ inputs.composer_update_spec }}
        run: |
          git add composer.json composer.lock \
                  TREE_MANIFEST.txt TREE_MANIFEST.sha256 SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "lock already carries the requested versions; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Apply Composer security update: $SPEC" \
            -m "composer.lock updated by composer update on a runner (Packagist is unreachable from the release-engineering sandbox, and lock resolution metadata cannot be hand-written), validated with composer validate --strict, gated on a clean composer audit --no-interaction, and reinstalled from scratch off the updated lock. Tree identity files regenerated by stage_tree.php with the fixed point verified in this run."
          git push
