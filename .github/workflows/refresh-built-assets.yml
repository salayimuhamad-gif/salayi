name: Refresh dependencies and built assets

# Two things can only be regenerated where the npm registry is reachable, and
# neither can be done from the offline release-engineering sandbox:
#
#   1. SECURITY UPDATES to package-lock.json. `npm audit fix` rewrites the lock
#      with patched versions and their real `integrity` hashes. Those hashes
#      cannot be hand-written — `npm ci` verifies them, and inventing one would
#      be fabricating evidence — so the fix has to happen on a runner.
#
#   2. THE COMMITTED public/build. It is part of the frozen tree identity, so it
#      must equal a fresh production build of the committed sources:
#      package-release.sh refuses to package from a tree whose assets a rebuild
#      would change, and the release build-reproducibility gate enforces the
#      same equality. A dependency update can change the emitted bytes, so the
#      rebuild belongs in the same run as the lock update.
#
# This manually-dispatched job does both, regenerates the tree identity files,
# and pushes the result back to the branch it ran on. It never fires on its own,
# and a run against an already-clean, already-fresh tree pushes nothing.
#
# It FAILS rather than pushing a half-fix: if `npm audit fix` cannot resolve
# every high-severity advisory within the declared semver ranges, the
# verification step below stops the run and the lock is left alone. Anything
# needing a major-version bump is a deliberate decision, not an automatic one.
#
# A push made with the workflow's own token does not trigger CI (GitHub's
# recursion guard), so dispatch the CI workflow against the branch afterwards
# to prove the refreshed tree.

on:
  workflow_dispatch:
    inputs:
      npm_install_spec:
        description: >-
          Optional npm package spec WITH a version or tag, e.g.
          @mapbox/mapbox-gl-rtl-text@0.2.3, to add as an exact-pinned
          dependency before the lock refresh. Empty (the default) leaves the
          dependency set untouched and the job behaves exactly as before.
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-built-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Update the lock and rebuild public/build from HEAD
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # From the committed lock first, so the starting point is exactly what
      # CI installs today.
      - run: npm ci

      # Optional dependency addition, here because the sandbox has no
      # registry route: npm resolves the version and writes the REAL
      # integrity hashes into package-lock.json itself — hand-editing
      # integrity data would be fabricating evidence, and `npm ci` would
      # reject it. --save-exact pins whatever the spec resolves to, and the
      # resolved version plus the package's actual file layout are printed
      # so import paths are written against facts, not guesses. The spec is
      # required to carry a version or tag, so stripping after the LAST @
      # always yields the bare package name (scopes keep their leading @).
      - name: Add a requested dependency, exact-pinned
        if: inputs.npm_install_spec != ''
        env:
          SPEC: ${{ inputs.npm_install_spec }}
        run: |
          npm install --save-exact "$SPEC"
          NAME="${SPEC%@*}"
          echo "== resolved entry in package.json =="
          grep -F "\"$NAME\"" package.json
          echo "== files shipped by the package =="
          find "node_modules/$NAME" -maxdepth 2 -type f | sort
          echo "== the package's own manifest (main/exports drive import paths) =="
          cat "node_modules/$NAME/package.json"

      # Semver-compatible security updates only: no --force, so a fix that
      # would require a major bump is reported rather than silently applied.
      - name: Apply security updates to the lock
        run: npm audit fix

      # The gate, not a formality. `npm audit fix` exits 0 even when it could
      # not fix everything, so the result is verified independently and the run
      # stops here if any high-severity advisory survives.
      - name: Verify no high-severity advisory survives
        run: npm audit --audit-level=high

      # The lock has changed, so prove it still installs cleanly and
      # deterministically before anything is built from it.
      - name: Reinstall from the updated lock
        run: npm ci

      - name: Production build
        run: npx vite build

      - name: Regenerate the tree identity
        # Script host only, exactly like the frontend-guard step in ci.yml.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php8.3-cli
          php scripts/release/stage_tree.php --project-root="$PWD" --stage-dir=/tmp/stage-a > /dev/null
          php scripts/release/stage_tree.php --project-root="$PWD" --stage-dir=/tmp/stage-b > /dev/null
          a=$(cut -d' ' -f1 /tmp/stage-a/TREE_MANIFEST.sha256)
          b=$(cut -d' ' -f1 /tmp/stage-b/TREE_MANIFEST.sha256)
          [ "$a" = "$b" ] || { echo "staging is not a fixed point: $a vs $b"; exit 1; }
          cp /tmp/stage-a/TREE_MANIFEST.txt /tmp/stage-a/TREE_MANIFEST.sha256 /tmp/stage-a/SHA256SUMS.txt .
          echo "tree identity: $a"

      - name: Commit and push if anything changed
        run: |
          git add -A package.json package-lock.json public/build \
                     TREE_MANIFEST.txt TREE_MANIFEST.sha256 SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "lock already clean and committed assets already equal a fresh build; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Update the dependency lock and refresh built assets" \
            -m "package-lock.json updated by npm audit fix on a runner (the registry is unreachable from the release-engineering sandbox, and integrity hashes cannot be hand-written), verified with npm audit --audit-level=high and reinstalled with npm ci. public/build rebuilt from HEAD with the resulting toolchain: committed assets must equal a fresh production build, or package-release.sh and the release build-reproducibility gate refuse. Tree identity files regenerated by stage_tree.php with the fixed point verified in this run."
          git push
