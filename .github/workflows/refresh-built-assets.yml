name: Refresh built assets

# The committed public/build is part of the frozen tree identity, so it must
# equal a fresh production build of the committed sources — package-release.sh
# refuses to package from a tree whose assets a rebuild would change, and the
# release pipeline's build-reproducibility gate enforces the same equality.
#
# Rebuilding is only possible where the npm registry is reachable, which is
# exactly what this manually-dispatched job provides: it rebuilds from HEAD
# with the locked toolchain, regenerates the tree identity files, and pushes
# the result back to the branch it ran on. It never fires on its own, and a
# run against already-fresh assets pushes nothing.
#
# A push made with the workflow's own token does not trigger CI (GitHub's
# recursion guard), so dispatch the CI workflow against the branch afterwards
# to prove the refreshed tree.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-built-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild public/build from HEAD
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Production build
        run: npx vite build

      - name: Regenerate the tree identity
        # Script host only, exactly like the frontend-guard step in ci.yml.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php8.3-cli
          php scripts/release/stage_tree.php --project-root="$PWD" --stage-dir=/tmp/stage-a > /dev/null
          php scripts/release/stage_tree.php --project-root="$PWD" --stage-dir=/tmp/stage-b > /dev/null
          a=$(cut -d' ' -f1 /tmp/stage-a/TREE_MANIFEST.sha256)
          b=$(cut -d' ' -f1 /tmp/stage-b/TREE_MANIFEST.sha256)
          [ "$a" = "$b" ] || { echo "staging is not a fixed point: $a vs $b"; exit 1; }
          cp /tmp/stage-a/TREE_MANIFEST.txt /tmp/stage-a/TREE_MANIFEST.sha256 /tmp/stage-a/SHA256SUMS.txt .
          echo "tree identity: $a"

      - name: Commit and push if the assets changed
        run: |
          git add -A public/build TREE_MANIFEST.txt TREE_MANIFEST.sha256 SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "committed assets already equal a fresh build; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Refresh built assets from committed sources" \
            -m "public/build rebuilt on CI from HEAD with the locked toolchain (npm ci + vite build): committed assets must equal a fresh production build, or package-release.sh and the release build-reproducibility gate refuse. Tree identity files regenerated by stage_tree.php with the fixed point verified in this run."
          git push
